<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>A-Frame Space Planets</title>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script>
      AFRAME.registerComponent("starfield", {
        init: function () {
          var group = document.createElement("a-entity");
          for (var i = 0; i < 500; i += 1) {
            var star = document.createElement("a-sphere");
            var radius = 70;
            var phi = Math.random() * Math.PI * 2;
            var costheta = Math.random() * 2 - 1;
            var theta = Math.acos(costheta);
            var x = radius * Math.sin(theta) * Math.cos(phi);
            var y = radius * Math.sin(theta) * Math.sin(phi);
            var z = radius * Math.cos(theta);

            star.setAttribute("position", x + " " + y + " " + z);
            star.setAttribute("radius", 0.06 + Math.random() * 0.06);
            star.setAttribute("color", "#ffffff");
            star.setAttribute("material", "shader: flat; emissive: #ffffff; emissiveIntensity: 1;");
            group.appendChild(star);
          }
          this.el.appendChild(group);
        },
      });

      // 카메라 시점 전환 & 실시간 중앙 트래킹 컴포넌트
      AFRAME.registerComponent("camera-view-switcher", {
        init: function () {
          this.targetIndex = 0; // 0: 기본, 1: 주황, 2: 청록, 3: 연두
          this.cameraPos = new THREE.Vector3(0, 1.6, 0); // 기본 위치 고정
          this.targetPos = new THREE.Vector3();
          this.upVector = new THREE.Vector3(0, 1, 0);
          this.lookMatrix = new THREE.Matrix4();
          this.defaultQuat = new THREE.Quaternion(0, 0, 0, 1);

          this.onContextMenu = this.onContextMenu.bind(this);
          window.addEventListener("contextmenu", this.onContextMenu);

          this.updateHUD();
        },

        getTargets: function () {
          if (!this.targets) {
            this.targets = [
              null,
              document.querySelector("#sphere-orange"),
              document.querySelector("#sphere-cyan"),
              document.querySelector("#sphere-green"),
            ];
          }
          return this.targets;
        },

        onContextMenu: function (e) {
          if (e) e.preventDefault();
          this.targetIndex = (this.targetIndex + 1) % 4;
          this.onTargetChange();
        },

        onTargetChange: function () {
          var camEl = document.querySelector("#main-camera");
          if (camEl) {
            var lc = camEl.components && camEl.components["look-controls"];
            if (lc) {
              lc.pitch = 0;
              lc.yaw = 0;
              if (lc.pitchObject) lc.pitchObject.rotation.x = 0;
              if (lc.yawObject) lc.yawObject.rotation.y = 0;
            }
            camEl.object3D.rotation.set(0, 0, 0);
            camEl.object3D.position.set(0, 0, 0);

            if (this.targetIndex === 0) {
              camEl.setAttribute("look-controls", "enabled", true);
              camEl.setAttribute("wasd-controls", "enabled", true);
            } else {
              camEl.setAttribute("look-controls", "enabled", false);
              camEl.setAttribute("wasd-controls", "enabled", false);
            }
          }

          this.updateHUD();
        },

        updateHUD: function () {
          var titleEl = document.getElementById("hud-title");
          var subEl = document.getElementById("hud-sub");
          var cardEl = document.getElementById("hud-card");
          var badgeEl = document.getElementById("hud-badge");
          if (!titleEl) return;

          var views = [
            {
              name: "기본 시점 (중심 뷰)",
              sub: "우클릭: 주황 구체 트래킹 (1/4)",
              color: "#94a3b8",
              glow: "rgba(148, 163, 184, 0.4)",
            },
            {
              name: "주황 구체 화면 중앙 트래킹",
              sub: "우클릭: 청록 구체 트래킹 (2/4)",
              color: "#f97316",
              glow: "rgba(249, 115, 22, 0.5)",
            },
            {
              name: "청록 구체 화면 중앙 트래킹",
              sub: "우클릭: 연두 구체 트래킹 (3/4)",
              color: "#42f5e9",
              glow: "rgba(66, 245, 233, 0.5)",
            },
            {
              name: "연두 구체 화면 중앙 트래킹",
              sub: "우클릭: 기본 시점으로 초기화 (4/4)",
              color: "#a3e635",
              glow: "rgba(163, 230, 53, 0.5)",
            },
          ];

          var current = views[this.targetIndex];
          titleEl.textContent = current.name;
          subEl.textContent = current.sub;
          badgeEl.style.backgroundColor = current.color;
          cardEl.style.borderColor = current.color;
          cardEl.style.boxShadow = "0 4px 20px " + current.glow;
        },

        tick: function () {
          this.el.object3D.position.copy(this.cameraPos);

          var targets = this.getTargets();
          var sphereEl = targets[this.targetIndex];

          if (sphereEl && sphereEl.object3D) {
            sphereEl.object3D.updateWorldMatrix(true, false);
            sphereEl.object3D.getWorldPosition(this.targetPos);

            this.lookMatrix.lookAt(this.cameraPos, this.targetPos, this.upVector);
            this.el.object3D.quaternion.setFromRotationMatrix(this.lookMatrix);
          } else {
            this.el.object3D.quaternion.copy(this.defaultQuat);
          }

          this.el.object3D.updateMatrixWorld(true);
        },

        remove: function () {
          window.removeEventListener("contextmenu", this.onContextMenu);
        },
      });

      // 3D 모델(model.obj) 개별 무작위 주기 생성/소멸 관리 컴포넌트 (항상 15개 이상 유지)
      AFRAME.registerComponent("random-obj-spawner", {
        init: function () {
          this.poolSize = 20; // 공간에 항상 15개 이상 유지되도록 20개 인스턴스 풀 운용
          this.instances = [];
          this.isLoaded = false;
          this.loadModel();
        },

        updateNotice: function (htmlText, isError) {
          var notice = document.getElementById("obj-hud-notice");
          if (!notice) return;
          notice.innerHTML = htmlText;
          notice.style.display = "block";
          if (isError) {
            notice.style.borderColor = "#f87171";
            notice.style.background = "rgba(69, 10, 10, 0.85)";
          }
        },

        loadModel: function () {
          var self = this;
          var LoaderClass = THREE.OBJLoader || (AFRAME.THREE && AFRAME.THREE.OBJLoader);
          if (!LoaderClass) {
            this.updateNotice("❌ OBJLoader를 찾을 수 없습니다.", true);
            return;
          }

          var loader = new LoaderClass();
          this.updateNotice("⏳ 3D 모델(model.obj) 로딩 중...", false);

          // model.obj 우선 시도, 실패 시 model (1).obj 시도
          loader.load(
            "model.obj",
            function (obj) {
              self.onModelLoaded(obj);
            },
            function (xhr) {
              if (xhr.lengthComputable && xhr.total > 0) {
                var pct = Math.round((xhr.loaded / xhr.total) * 100);
                self.updateNotice("⏳ model.obj 다운로드 중: " + pct + "%", false);
              } else if (xhr.loaded) {
                var mb = (xhr.loaded / (1024 * 1024)).toFixed(1);
                self.updateNotice("⏳ model.obj 로딩 중: " + mb + " MB", false);
              }
            },
            function (err) {
              // fallback to "model (1).obj"
              loader.load(
                "model (1).obj",
                function (obj) {
                  self.onModelLoaded(obj);
                },
                null,
                function (err2) {
                  self.showFallbackPicker();
                }
              );
            }
          );
        },

        showFallbackPicker: function () {
          var self = this;
          this.updateNotice(
            '⚠️ 로컬 브라우저 보안(CORS)으로 자동로드가 차단되었습니다.<br>' +
            '<button id="btn-pick-obj" style="margin-top:6px;padding:6px 12px;background:#3b82f6;color:#fff;border:none;border-radius:6px;cursor:pointer;font-weight:600;font-size:12px;">📂 model.obj 파일 직접 선택</button>' +
            '<input type="file" id="input-obj-file" accept=".obj" style="display:none">',
            true
          );

          var btn = document.getElementById("btn-pick-obj");
          var input = document.getElementById("input-obj-file");
          if (btn && input) {
            btn.onclick = function () { input.click(); };
            input.onchange = function (e) {
              var file = e.target.files[0];
              if (!file) return;
              self.updateNotice("⏳ 파일 읽는 중 (" + (file.size / (1024 * 1024)).toFixed(1) + "MB)... 잠시만 기다려주세요.", false);
              var reader = new FileReader();
              reader.onload = function (evt) {
                self.updateNotice("⚙️ 3D 모델 파싱 중... (약 2~3초 소요)", false);
                setTimeout(function () {
                  try {
                    var LoaderClass = THREE.OBJLoader || (AFRAME.THREE && AFRAME.THREE.OBJLoader);
                    var loader = new LoaderClass();
                    var parsedObj = loader.parse(evt.target.result);
                    self.onModelLoaded(parsedObj);
                  } catch (parseErr) {
                    self.updateNotice("❌ 모델 파싱 오류: " + parseErr.message, true);
                  }
                }, 50);
              };
              reader.readAsText(file);
            };
          }
        },

        onModelLoaded: function (obj) {
          var self = this;
          this.isLoaded = true;

          // 공용 메탈릭 우주 머티리얼 적용
          var sharedMaterial = new THREE.MeshStandardMaterial({
            color: 0xc7d2fe, // 세련된 은백색/라벤더 메탈릭
            metalness: 0.65,
            roughness: 0.35,
          });

          obj.traverse(function (child) {
            if (child.isMesh) {
              child.geometry.center(); // 기하학적 중심을 원점에 일치
              child.material = sharedMaterial;
            }
          });

          var container = new THREE.Group();
          this.el.object3D.add(container);
          this.container = container;

          // 20개 인스턴스 풀 생성 (Geometry & Material 공유로 VRAM 낭비 제로, 항상 15개 이상 유지)
          for (var i = 0; i < this.poolSize; i++) {
            var clone = obj.clone(true);
            container.add(clone);

            var inst = {
              object3D: clone,
              duration: 1.6 + Math.random() * 2.4, // 각자 완전히 다른 생존 시간 (1.6초 ~ 4.0초)
              timer: 0,
              targetScale: 0.7 + Math.random() * 1.0,
              rotSpeedX: (Math.random() - 0.5) * 0.8,
              rotSpeedY: (Math.random() - 0.5) * 0.8,
              rotSpeedZ: (Math.random() - 0.5) * 0.8,
            };

            this.randomizeInstance(inst);
            // 초기 타이머를 각자의 생존 주기 내에서 무작위로 분산시켜 동시 소멸 방지
            inst.timer = Math.random() * inst.duration;
            this.updateInstanceTransform(inst, 0);
            this.instances.push(inst);
          }

          this.updateNotice("✨ 3D 오브젝트 활성화됨 (항상 15+ 개 개별 주기 순환 중)", false);
          setTimeout(function () {
            var notice = document.getElementById("obj-hud-notice");
            if (notice) notice.style.display = "none";
          }, 3500);
        },

        randomizeInstance: function (inst) {
          // 중심(0, 1.6, 0)을 기준으로 거리 4.5m ~ 17m 범위의 구면 공간에 무작위 배치
          var r = 4.5 + Math.random() * 12.5;
          var phi = Math.random() * Math.PI * 2;
          var cosTheta = (Math.random() * 2 - 1) * 0.82;
          var sinTheta = Math.sqrt(Math.max(0, 1 - cosTheta * cosTheta));

          var x = r * sinTheta * Math.cos(phi);
          var y = 1.6 + r * cosTheta;
          var z = r * sinTheta * Math.sin(phi);

          inst.object3D.position.set(x, y, z);
          inst.object3D.rotation.set(
            Math.random() * Math.PI * 2,
            Math.random() * Math.PI * 2,
            Math.random() * Math.PI * 2
          );

          inst.rotSpeedX = (Math.random() - 0.5) * 0.8;
          inst.rotSpeedY = (Math.random() - 0.5) * 0.8;
          inst.rotSpeedZ = (Math.random() - 0.5) * 0.8;

          // 크기 랜덤, 그러나 너무 작지 않게 (0.7 ~ 1.7배)
          inst.targetScale = 0.7 + Math.random() * 1.0;
          // 생겼다 사라지는 시간을 오브젝트마다 모두 다르게 무작위 부여 (1.6초 ~ 4.0초)
          inst.duration = 1.6 + Math.random() * 2.4;
          inst.timer = 0;
        },

        updateInstanceTransform: function (inst, dt) {
          // 팝인/팝아웃 스케일링
          var popTime = Math.min(0.2, inst.duration * 0.15);
          var s = 0;
          if (inst.timer < popTime) {
            s = (inst.timer / popTime) * inst.targetScale;
          } else if (inst.timer > inst.duration - popTime) {
            s = Math.max(0, ((inst.duration - inst.timer) / popTime) * inst.targetScale);
          } else {
            s = inst.targetScale;
          }

          inst.object3D.scale.set(s, s, s);

          if (dt > 0) {
            inst.object3D.rotation.x += inst.rotSpeedX * dt;
            inst.object3D.rotation.y += inst.rotSpeedY * dt;
            inst.object3D.rotation.z += inst.rotSpeedZ * dt;
          }
        },

        tick: function (time, timeDelta) {
          if (!this.isLoaded || !this.instances.length) return;

          var dt = (timeDelta || 16.6) / 1000;
          if (dt > 0.1) dt = 0.1;

          for (var i = 0; i < this.instances.length; i++) {
            var inst = this.instances[i];
            inst.timer += dt;

            // 각자의 수명이 다해 사라지면 즉시 새로운 개별 수명과 함께 다음 무작위 공간에 생성
            if (inst.timer >= inst.duration) {
              this.randomizeInstance(inst);
              this.updateInstanceTransform(inst, 0);
            } else {
              this.updateInstanceTransform(inst, dt);
            }
          }
        },
      });
    </script>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #020617;
      }

      #hud {
        position: fixed;
        top: 20px;
        left: 20px;
        z-index: 9999;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        user-select: none;
      }

      .hud-card {
        background: rgba(15, 23, 42, 0.78);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 12px;
        padding: 12px 18px;
        color: #f8fafc;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        transition: border-color 0.25s ease, box-shadow 0.25s ease;
        cursor: pointer;
      }

      .hud-title {
        font-size: 14px;
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .hud-sub {
        font-size: 12px;
        color: #94a3b8;
        margin-top: 4px;
      }

      .hud-badge {
        display: inline-block;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #94a3b8;
        box-shadow: 0 0 6px currentColor;
      }

      #obj-hud-notice {
        margin-top: 8px;
        font-size: 12px;
        color: #e2e8f0;
        background: rgba(15, 23, 42, 0.85);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border: 1px solid rgba(59, 130, 246, 0.4);
        border-radius: 10px;
        padding: 10px 14px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.35);
        transition: all 0.3s ease;
      }
    </style>
  </head>
  <body>
    <div id="hud">
      <div
        id="hud-card"
        class="hud-card"
        onclick="document.querySelector('#camera-rig').components['camera-view-switcher'].onContextMenu()"
      >
        <div class="hud-title">
          <span id="hud-badge" class="hud-badge"></span>
          <span id="hud-title">기본 시점 (중심 뷰)</span>
        </div>
        <div id="hud-sub" class="hud-sub">우클릭: 주황 구체 트래킹 (1/4)</div>
      </div>
      <div id="obj-hud-notice">🛸 3D 오브젝트(model.obj) 로딩 중...</div>
    </div>

    <a-scene background="color: #56009c">
      <a-entity starfield></a-entity>

      <a-entity light="type: ambient; color: #718096; intensity: 0.9"></a-entity>
      <a-entity
        light="type: point; color: #ffffff; intensity: 1.4; distance: 90"
        position="0 6 6"
      ></a-entity>

      <!-- 3D 모델(model.obj) 무작위 순환 생성기 -->
      <a-entity id="obj-spawner" random-obj-spawner></a-entity>

      <!-- 행성 시스템 루트 (공전 중심: 0 1.6 0) -->
      <a-entity id="planets-root" position="0 1.6 0">
        <!-- 1. 주황 구체 -->
        <a-entity
          id="orbit-orange"
          animation="property: rotation; to: 0 360 0; loop: true; dur: 1125; easing: linear;"
        >
          <a-sphere
            id="sphere-orange"
            position="2.8 0.2 0"
            radius="0.42"
            color="#f97316"
            material="metalness: 0.15; roughness: 0.65;"
            animation="property: rotation; to: 0 360 0; loop: true; dur: 550; easing: linear;"
          ></a-sphere>
        </a-entity>

        <!-- 2. 청록 구체 -->
        <a-entity
          id="orbit-cyan"
          rotation="14 0 0"
          animation="property: rotation; to: 0 360 0; loop: true; dur: 1750; easing: linear;"
        >
          <a-sphere
            id="sphere-cyan"
            position="4.2 -0.1 0"
            radius="0.52"
            color="#42f5e9"
            material="metalness: 0.2; roughness: 0.55;"
            animation="property: rotation; to: 0 360 0; loop: true; dur: 750; easing: linear;"
          ></a-sphere>
        </a-entity>

        <!-- 3. 연두 구체 -->
        <a-entity
          id="orbit-green"
          rotation="-10 0 0"
          animation="property: rotation; to: 0 360 0; loop: true; dur: 2550; easing: linear;"
        >
          <a-sphere
            id="sphere-green"
            position="5.6 0.35 0"
            radius="0.36"
            color="#a3e635"
            material="metalness: 0.18; roughness: 0.6;"
            animation="property: rotation; to: 0 360 0; loop: true; dur: 950; easing: linear;"
          ></a-sphere>
        </a-entity>
      </a-entity>

      <!-- 카메라 리그: 항상 (0, 1.6, 0) 기본 위치에 고정 -->
      <a-entity id="camera-rig" position="0 1.6 0" camera-view-switcher>
        <a-camera id="main-camera" position="0 0 0" look-controls wasd-controls></a-camera>
      </a-entity>
    </a-scene>
  </body>
</html>
