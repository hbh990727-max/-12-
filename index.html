<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Floating Sky Island - 귀여운 사탕 & 곰돌이 하늘섬</title>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script>
      // 🌸 1. 섬 잔디밭 위에 피어나는 85송이 꽃밭
      AFRAME.registerComponent("flower-field", {
        init: function () {
          var group = document.createElement("a-entity");
          var petalColors = [
            "#f43f5e",
            "#fb7185",
            "#ec4899",
            "#a855f7",
            "#38bdf8",
            "#fbbf24",
            "#ffffff",
            "#f97316",
          ];
          var count = 85;

          for (var i = 0; i < count; i++) {
            var angle = Math.random() * Math.PI * 2;
            var dist = 0.7 + Math.random() * 2.8;
            var x = Math.cos(angle) * dist;
            var z = Math.sin(angle) * dist;

            if (
              Math.hypot(x - 0, z - -1.4) < 1.0 ||
              Math.hypot(x - -1.2, z - 0.5) < 1.1
            ) {
              continue;
            }

            var flower = document.createElement("a-entity");
            flower.setAttribute("position", x + " 0.23 " + z);

            var stemHeight = 0.14 + Math.random() * 0.16;
            var stem = document.createElement("a-cylinder");
            stem.setAttribute("position", "0 " + stemHeight / 2 + " 0");
            stem.setAttribute("radius", "0.015");
            stem.setAttribute("height", stemHeight);
            stem.setAttribute("color", "#16a34a");
            flower.appendChild(stem);

            var pColor = petalColors[Math.floor(Math.random() * petalColors.length)];
            var blossom = document.createElement("a-sphere");
            blossom.setAttribute("position", "0 " + stemHeight + " 0");
            blossom.setAttribute("radius", 0.06 + Math.random() * 0.04);
            blossom.setAttribute("color", pColor);
            blossom.setAttribute("material", "roughness: 0.35;");
            flower.appendChild(blossom);

            var core = document.createElement("a-sphere");
            core.setAttribute("position", "0 " + (stemHeight + 0.02) + " 0");
            core.setAttribute("radius", "0.03");
            core.setAttribute("color", "#fef08a");
            flower.appendChild(core);

            flower.setAttribute("animation", {
              property: "rotation",
              to: Math.random() * 8 - 4 + " 0 " + (Math.random() * 8 - 4),
              dir: "alternate",
              loop: true,
              dur: 1800 + Math.random() * 2000,
              easing: "easeInOutSine",
            });

            group.appendChild(flower);
          }
          this.el.appendChild(group);
        },
      });

      // ✨ 2. 하늘과 지면에 흩날리는 450개의 찬란한 반짝이 가루
      AFRAME.registerComponent("sparkle-field", {
        init: function () {
          var group = document.createElement("a-entity");
          var colors = [
            "#ffffff",
            "#fef08a",
            "#fbcfe8",
            "#bae6fd",
            "#c4b5fd",
            "#fde047",
            "#6ee7b7",
          ];

          for (var i = 0; i < 450; i++) {
            var sparkle = document.createElement("a-sphere");
            var x = (Math.random() - 0.5) * 55;
            var y = Math.random() * 26 - 3;
            var z = (Math.random() - 0.5) * 55;

            var color = colors[Math.floor(Math.random() * colors.length)];
            var radius = 0.035 + Math.random() * 0.06;

            sparkle.setAttribute("position", x + " " + y + " " + z);
            sparkle.setAttribute("radius", radius);
            sparkle.setAttribute("color", color);
            sparkle.setAttribute(
              "material",
              "shader: flat; emissive: " +
                color +
                "; emissiveIntensity: 1; opacity: 0.9; transparent: true;",
            );

            var dur = 2500 + Math.random() * 3500;
            sparkle.setAttribute("animation", {
              property: "position",
              to:
                x +
                (Math.random() * 1.8 - 0.9) +
                " " +
                (y + 1.6 + Math.random()) +
                " " +
                (z + (Math.random() * 1.8 - 0.9)),
              dir: "alternate",
              loop: true,
              dur: dur,
              easing: "easeInOutSine",
            });

            group.appendChild(sparkle);
          }
          this.el.appendChild(group);
        },
      });
    </script>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #93c5fd;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      /* 상단 귀여운 파스텔 UI */
      .ui-overlay {
        position: absolute;
        top: 20px;
        left: 20px;
        z-index: 999;
        color: #0f172a;
        background: rgba(255, 255, 255, 0.9);
        backdrop-filter: blur(12px);
        padding: 16px 24px;
        border-radius: 20px;
        border: 1px solid rgba(255, 255, 255, 0.7);
        pointer-events: none;
        user-select: none;
        box-shadow: 0 12px 30px -5px rgba(244, 114, 182, 0.25), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
      }
      .ui-overlay h1 {
        margin: 0 0 6px 0;
        font-size: 1.2rem;
        font-weight: 700;
        color: #db2777;
        letter-spacing: -0.02em;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .ui-overlay p {
        margin: 0;
        font-size: 0.88rem;
        color: #475569;
        line-height: 1.5;
        font-weight: 500;
      }
      .ui-badge {
        display: inline-block;
        background: #fce7f3;
        color: #db2777;
        padding: 2px 8px;
        border-radius: 6px;
        font-size: 0.75rem;
        margin-right: 6px;
        font-weight: 600;
      }
      .crosshair {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 8px;
        height: 8px;
        background: rgba(255, 255, 255, 0.8);
        border: 1.5px solid rgba(219, 39, 119, 0.7);
        border-radius: 50%;
        pointer-events: none;
        z-index: 999;
      }
    </style>
  </head>
  <body>
    <!-- 안내 UI -->
    <div class="ui-overlay">
      <h1>🧸 스위트 캔디 하늘섬 (Sweet Sky Island) 🍭</h1>
      <p>
        <span class="ui-badge">1인칭 산책</span> 마우스 드래그로 시점 둘러보기 &bull; W/A/S/D 키로 꽃밭 걷기
      </p>
    </div>
    <div class="crosshair"></div>

    <a-scene background="color: #93c5fd" fog="type: linear; color: #bae6fd; near: 25; far: 65">
      <!-- 450개의 찬란한 반짝이 가루 -->
      <a-entity sparkle-field></a-entity>

      <!-- 화사한 햇살 및 조명 -->
      <a-entity light="type: ambient; color: #ffffff; intensity: 0.9"></a-entity>
      <a-entity
        light="type: directional; color: #fffbeb; intensity: 1.1; castShadow: true"
        position="10 18 12"
      ></a-entity>
      <a-entity
        light="type: directional; color: #bae6fd; intensity: 0.45"
        position="-10 -6 -12"
      ></a-entity>

      <!-- 🚶 1인칭 플레이어: 잔디밭 위 걷기 -->
      <a-entity id="player" position="0 1.6 1.8">
        <a-camera
          look-controls="pointerLockEnabled: false"
          wasd-controls="acceleration: 18; fly: false"
          position="0 0 0"
        ></a-camera>
      </a-entity>

      <!-- ================= ☁️ 풍성한 입체 다층 구름 시스템 ================= -->
      <a-entity id="clouds">
        <a-entity position="-15 11 -10" animation="property: position; to: 18 11 -10; loop: true; dur: 55000; easing: linear;">
          <a-sphere position="0 0 0" radius="2.0" color="#ffffff" opacity="0.95"></a-sphere>
          <a-sphere position="1.6 -0.3 0" radius="1.5" color="#ffffff" opacity="0.95"></a-sphere>
          <a-sphere position="-1.5 -0.3 0" radius="1.4" color="#ffffff" opacity="0.95"></a-sphere>
          <a-sphere position="0.8 0.7 0.3" radius="1.3" color="#ffffff" opacity="0.95"></a-sphere>
        </a-entity>

        <a-entity position="12 13 -16" animation="property: position; to: -20 13 -16; loop: true; dur: 70000; easing: linear;">
          <a-sphere position="0 0 0" radius="2.6" color="#ffffff" opacity="0.92"></a-sphere>
          <a-sphere position="2.0 -0.4 0" radius="1.8" color="#ffffff" opacity="0.92"></a-sphere>
          <a-sphere position="-1.9 -0.3 0" radius="1.7" color="#ffffff" opacity="0.92"></a-sphere>
        </a-entity>

        <a-entity position="-8 6 12" animation="property: position; to: 14 6 12; loop: true; dur: 48000; easing: linear;">
          <a-sphere position="0 0 0" radius="1.6" color="#ffffff" opacity="0.9"></a-sphere>
          <a-sphere position="1.2 -0.2 0" radius="1.2" color="#ffffff" opacity="0.9"></a-sphere>
          <a-sphere position="-1.1 -0.25 0" radius="1.1" color="#ffffff" opacity="0.9"></a-sphere>
        </a-entity>

        <!-- 하단 운해(구름 바다) -->
        <a-entity position="0 -4.5 0">
          <a-sphere position="-6 0 -5" radius="3.8" color="#ffffff" opacity="0.85"></a-sphere>
          <a-sphere position="6 0 -4" radius="4.2" color="#ffffff" opacity="0.85"></a-sphere>
          <a-sphere position="-4 0 6" radius="3.5" color="#ffffff" opacity="0.85"></a-sphere>
          <a-sphere position="5 0 5" radius="3.9" color="#ffffff" opacity="0.85"></a-sphere>
          <a-sphere position="0 -0.5 -8" radius="4.5" color="#ffffff" opacity="0.85"></a-sphere>
        </a-entity>
      </a-entity>

      <!-- ================= 🧸 1. 풍선 3개를 쥐고 하늘을 날아다니는 귀여운 곰돌이 ================= -->
      <a-entity animation="property: rotation; to: 0 360 0; loop: true; dur: 18000; easing: linear;">
        <a-entity position="4.6 3.4 0" animation="property: position; to: 4.6 4.1 0; dir: alternate; loop: true; dur: 2200; easing: easeInOutSine;">
          <!-- 🎈 알록달록 풍선 3개 -->
          <a-sphere position="-0.22 1.35 0" radius="0.32" color="#f43f5e"></a-sphere>
          <a-sphere position="0.22 1.45 0" radius="0.34" color="#fde047"></a-sphere>
          <a-sphere position="0 1.55 0.15" radius="0.32" color="#38bdf8"></a-sphere>
          <!-- 풍선 끈 -->
          <a-cylinder position="-0.11 0.7 0" radius="0.008" height="1.1" rotation="0 0 12" color="#cbd5e1"></a-cylinder>
          <a-cylinder position="0.11 0.75 0" radius="0.008" height="1.2" rotation="0 0 -10" color="#cbd5e1"></a-cylinder>
          <a-cylinder position="0 0.8 0.08" radius="0.008" height="1.3" color="#cbd5e1"></a-cylinder>

          <!-- 🧸 곰돌이 본체 -->
          <a-entity position="0 0 0">
            <!-- 머리 -->
            <a-sphere radius="0.28" color="#a16207"></a-sphere>
            <!-- 둥근 귀 2개 (겉귀 + 속귀) -->
            <a-sphere position="-0.22 0.22 0" radius="0.09" color="#a16207"></a-sphere>
            <a-sphere position="-0.22 0.22 0.04" radius="0.05" color="#fbcfe8"></a-sphere>
            <a-sphere position="0.22 0.22 0" radius="0.09" color="#a16207"></a-sphere>
            <a-sphere position="0.22 0.22 0.04" radius="0.05" color="#fbcfe8"></a-sphere>
            <!-- 통통한 주둥이와 깜찍한 코, 눈 -->
            <a-sphere position="0 -0.06 0.22" radius="0.12" color="#fef08a" scale="1 0.85 0.8"></a-sphere>
            <a-sphere position="0 -0.02 0.31" radius="0.035" color="#0f172a"></a-sphere>
            <a-sphere position="-0.09 0.05 0.25" radius="0.025" color="#0f172a"></a-sphere>
            <a-sphere position="0.09 0.05 0.25" radius="0.025" color="#0f172a"></a-sphere>
            <!-- 볼터치 (핑크) -->
            <a-circle position="-0.14 -0.04 0.24" radius="0.035" color="#fb7185"></a-circle>
            <a-circle position="0.14 -0.04 0.24" radius="0.035" color="#fb7185"></a-circle>
            <!-- 통통한 몸통과 배 패치 -->
            <a-sphere position="0 -0.42 0" radius="0.32" scale="1 1.15 0.9" color="#a16207"></a-sphere>
            <a-sphere position="0 -0.4 0.24" radius="0.18" scale="1 1.1 0.5" color="#fef08a"></a-sphere>
            <!-- 풍선 잡고 만세한 오른팔 & 왼팔 -->
            <a-cylinder position="0.28 -0.15 0.05" radius="0.07" height="0.45" rotation="-30 0 -50" color="#a16207"></a-cylinder>
            <a-cylinder position="-0.28 -0.38 0.08" radius="0.07" height="0.35" rotation="10 0 35" color="#a16207"></a-cylinder>
            <!-- 귀여운 다리 2개 -->
            <a-sphere position="-0.15 -0.72 0.08" radius="0.11" color="#a16207"></a-sphere>
            <a-sphere position="0.15 -0.72 0.08" radius="0.11" color="#a16207"></a-sphere>
          </a-entity>
        </a-entity>
      </a-entity>

      <!-- ================= 🍭 2. 하늘에서 회전하며 떠다니는 달콤한 사탕 & 디저트들 ================= -->

      <!-- 🍭 대형 딸기우유 롤리팝 사탕 (자전 + 공중 부유) -->
      <a-entity position="-3.5 4.5 2.2" animation="property: position; to: -3.5 5.1 2.2; dir: alternate; loop: true; dur: 2600; easing: easeInOutSine;">
        <a-entity animation="property: rotation; to: 0 360 360; loop: true; dur: 7000; easing: linear;">
          <!-- 롤리팝 원반 본체 -->
          <a-cylinder radius="0.6" height="0.1" color="#f43f5e" rotation="90 0 0"></a-cylinder>
          <a-ring radius-inner="0.25" radius-outer="0.45" position="0 0 0.06" color="#ffffff" material="side: double;"></a-ring>
          <a-ring radius-inner="0.25" radius-outer="0.45" position="0 0 -0.06" color="#ffffff" material="side: double;"></a-ring>
          <!-- 하얀 막대기 -->
          <a-cylinder position="0 -0.7 0" radius="0.03" height="1.2" color="#ffffff"></a-cylinder>
        </a-entity>
      </a-entity>

      <!-- 🍋 상큼한 레몬민트 롤리팝 사탕 -->
      <a-entity position="3.8 5.2 -2.5" animation="property: position; to: 3.8 5.8 -2.5; dir: alternate; loop: true; dur: 3000; easing: easeInOutSine;">
        <a-entity animation="property: rotation; to: 360 360 0; loop: true; dur: 8500; easing: linear;">
          <a-cylinder radius="0.55" height="0.1" color="#22c55e" rotation="90 0 0"></a-cylinder>
          <a-ring radius-inner="0.22" radius-outer="0.4" position="0 0 0.06" color="#fef08a" material="side: double;"></a-ring>
          <a-cylinder position="0 -0.65 0" radius="0.03" height="1.1" color="#ffffff"></a-cylinder>
        </a-entity>
      </a-entity>

      <!-- 🍬 리본으로 묶인 귀여운 딸기 캔디 (Wrapped Candy) -->
      <a-entity position="-2.4 5.8 -3.2" animation="property: position; to: -2.4 6.4 -3.2; dir: alternate; loop: true; dur: 2400; easing: easeInOutSine;">
        <a-entity animation="property: rotation; to: 0 360 180; loop: true; dur: 6000; easing: linear;">
          <!-- 캔디 중앙 몸체 -->
          <a-sphere radius="0.35" scale="1 0.8 0.8" color="#ec4899" material="metalness: 0.2; roughness: 0.3;"></a-sphere>
          <!-- 양쪽 포장 꼬리 -->
          <a-cone position="0.5 0 0" radius-bottom="0.25" radius-top="0.05" height="0.35" rotation="0 0 -90" color="#fbcfe8"></a-cone>
          <a-cone position="-0.5 0 0" radius-bottom="0.25" radius-top="0.05" height="0.35" rotation="0 0 90" color="#fbcfe8"></a-cone>
        </a-entity>
      </a-entity>

      <!-- 🧁 공중에 둥둥 떠서 도는 파스텔 마카롱 (Floating Macaron) -->
      <a-entity position="2.2 4.0 3.2" animation="property: position; to: 2.2 4.5 3.2; dir: alternate; loop: true; dur: 2000; easing: easeInOutSine;">
        <a-entity animation="property: rotation; to: 360 360 0; loop: true; dur: 7500; easing: linear;">
          <!-- 위아래 꼬끄 -->
          <a-sphere position="0 0.1 0" radius="0.32" scale="1 0.45 1" color="#38bdf8"></a-sphere>
          <a-sphere position="0 -0.1 0" radius="0.32" scale="1 0.45 1" color="#38bdf8"></a-sphere>
          <!-- 달콤한 화이트 크림 -->
          <a-cylinder position="0 0 0" radius="0.28" height="0.1" color="#ffffff"></a-cylinder>
        </a-entity>
      </a-entity>

      <!-- ================= 💫 천상의 3중 마법 링 & 크리스탈 ================= -->
      <a-entity position="0 8.5 -2.5">
        <a-torus
          radius="3.2"
          radius-tubular="0.045"
          material="shader: flat; color: #fde047; emissive: #eab308; emissiveIntensity: 0.9;"
          animation="property: rotation; to: 360 360 0; loop: true; dur: 14000; easing: linear;"
        ></a-torus>
        <a-torus
          radius="2.4"
          radius-tubular="0.04"
          material="shader: flat; color: #38bdf8; emissive: #0284c7; emissiveIntensity: 0.9;"
          animation="property: rotation; to: 0 360 360; loop: true; dur: 9000; easing: linear;"
        ></a-torus>
        <a-torus
          radius="1.6"
          radius-tubular="0.035"
          material="shader: flat; color: #f472b6; emissive: #db2777; emissiveIntensity: 0.9;"
          animation="property: rotation; to: 360 0 360; loop: true; dur: 6500; easing: linear;"
        ></a-torus>
        <a-sphere
          radius="0.45"
          color="#ffffff"
          material="shader: flat; emissive: #ffffff; emissiveIntensity: 1;"
          animation="property: scale; to: 1.25 1.25 1.25; dir: alternate; loop: true; dur: 1800; easing: easeInOutSine;"
        ></a-sphere>
      </a-entity>

      <!-- ================= 🎈 열기구 & 바구니 속 귀여운 아기 곰돌이 ================= -->
      <a-entity animation="property: rotation; to: 0 360 0; loop: true; dur: 24000; easing: linear;">
        <a-entity position="7.5 4.5 0" animation="property: position; to: 7.5 5.3 0; dir: alternate; loop: true; dur: 2500; easing: easeInOutSine;">
          <a-sphere position="0 0 0" radius="1.2" color="#f43f5e" scale="1 1.25 1"></a-sphere>
          <a-sphere position="0 0 0" radius="1.21" color="#fbbf24" scale="0.95 1.26 0.95"></a-sphere>
          <a-cone position="0 -1.0 0" radius-bottom="0.35" radius-top="0.75" height="0.55" color="#f43f5e"></a-cone>
          <a-cylinder position="0.22 -1.4 0.22" radius="0.012" height="0.6" color="#64748b"></a-cylinder>
          <a-cylinder position="-0.22 -1.4 0.22" radius="0.012" height="0.6" color="#64748b"></a-cylinder>
          <a-cylinder position="0.22 -1.4 -0.22" radius="0.012" height="0.6" color="#64748b"></a-cylinder>
          <a-cylinder position="-0.22 -1.4 -0.22" radius="0.012" height="0.6" color="#64748b"></a-cylinder>
          <!-- 바구니 -->
          <a-box position="0 -1.75 0" width="0.5" height="0.4" depth="0.5" color="#b45309"></a-box>

          <!-- 🧸 바구니 밖을 내다보는 귀여운 아기 곰돌이 -->
          <a-entity position="0 -1.5 0.22">
            <a-sphere radius="0.12" color="#d97706"></a-sphere>
            <a-sphere position="-0.09 0.09 0" radius="0.04" color="#d97706"></a-sphere>
            <a-sphere position="0.09 0.09 0" radius="0.04" color="#d97706"></a-sphere>
            <a-sphere position="0 -0.02 0.09" radius="0.05" color="#fef08a"></a-sphere>
            <a-sphere position="0 0 0.13" radius="0.015" color="#0f172a"></a-sphere>
            <a-sphere position="-0.12 -0.05 0.06" radius="0.035" color="#d97706"></a-sphere>
            <a-sphere position="0.12 -0.05 0.06" radius="0.035" color="#d97706"></a-sphere>
          </a-entity>
        </a-entity>
      </a-entity>

      <!-- 하늘을 도는 종이비행기 -->
      <a-entity rotation="15 0 -10" animation="property: rotation; to: 15 360 -10; loop: true; dur: 8000; easing: linear;">
        <a-entity position="5.5 3.0 0" rotation="0 90 20">
          <a-cone radius-bottom="0.5" radius-top="0.02" height="0.9" rotation="90 0 0" scale="1.4 0.1 1" color="#ffffff"></a-cone>
          <a-box position="0 0.1 -0.1" width="0.04" height="0.28" depth="0.55" color="#f1f5f9"></a-box>
        </a-entity>
      </a-entity>

      <!-- ================= 🏝️ 메인 하늘섬 & 풍성한 꽃밭 ================= -->
      <a-entity id="main-island" position="0 0 0">
        <!-- 상단 잔디 대지 -->
        <a-cylinder position="0 0 0" radius="3.8" height="0.45" color="#4ade80" material="roughness: 0.9; metalness: 0.05"></a-cylinder>
        <a-cone position="0 -1.2 0" radius-bottom="0.2" radius-top="3.8" height="2.0" color="#854d0e" material="roughness: 0.95"></a-cone>
        <a-dodecahedron position="-0.8 -2.4 0.4" radius="0.35" color="#713f12"></a-dodecahedron>
        <a-dodecahedron position="0.9 -2.2 -0.5" radius="0.28" color="#713f12"></a-dodecahedron>

        <!-- 🌸 섬 전역 85송이 꽃밭 -->
        <a-entity flower-field></a-entity>

        <!-- 🍭 잔디밭에 꽂혀 있는 귀여운 미니 롤리팝 사탕들 -->
        <a-entity position="1.1 0.23 1.5">
          <a-cylinder position="0 0.2 0" radius="0.015" height="0.4" color="#ffffff"></a-cylinder>
