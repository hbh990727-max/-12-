<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>A-Frame Space Planets</title>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script>
      // 별 모양 커스텀 컴포넌트
      AFRAME.registerComponent("star-shape", {
        schema: {
          color: { type: "color", default: "#F70000" },
          size: { type: "number", default: 0.52 }
        },
        init: function () {
          var el = this.el;
          var color = this.data.color;
          var s = this.data.size;
          var tips = 6;
          for (var i = 0; i < tips; i++) {
            var angle = (i / tips) * Math.PI * 2;
            var cone = document.createElement("a-cone");
            cone.setAttribute("color", color);
            cone.setAttribute("material", "metalness: 0.2; roughness: 0.55;");
            cone.setAttribute("radius-bottom", s * 0.28);
            cone.setAttribute("radius-top", 0);
            cone.setAttribute("height", s * 1.1);
            var cx = Math.cos(angle) * s * 0.3;
            var cy = Math.sin(angle) * s * 0.3;
            cone.setAttribute("position", cx + " " + cy + " 0");
            cone.setAttribute("rotation", "0 0 " + (-angle * 180 / Math.PI + 90));
            el.appendChild(cone);
          }
          // 중앙 구
          var center = document.createElement("a-sphere");
          center.setAttribute("color", color);
          center.setAttribute("material", "metalness: 0.2; roughness: 0.55;");
          center.setAttribute("radius", s * 0.35);
          el.appendChild(center);
        }
      });

      AFRAME.registerComponent("starfield", {
        init: function () {
          var group = document.createElement("a-entity");
          var stars = [];

          for (var i = 0; i < 500; i += 1) {
            var star = document.createElement("a-sphere");
            var radius = 70;
            var phi = Math.random() * Math.PI * 2;
            var costheta = Math.random() * 2 - 1;
            var theta = Math.acos(costheta);
            var x = radius * Math.sin(theta) * Math.cos(phi);
            var y = radius * Math.sin(theta) * Math.sin(phi);
            var z = radius * Math.cos(theta);

            star.setAttribute("position", x + " " + y + " " + z);
            star.setAttribute("radius", 0.06 + Math.random() * 0.06);
            star.setAttribute("color", "#ffffff");
            star.setAttribute("material", "shader: flat; emissive: #ffffff; emissiveIntensity: 1;");
            group.appendChild(star);
            stars.push(star);
          }
          this.el.appendChild(group);

          // 2초마다 무작위로 다른 별들이 금색으로 반짝이게 교체
          var glowingStars = [];
          var NUM_GLOW = 40;

          function updateGlowing() {
            // 이전 금색 별들 흰색으로 초기화
            glowingStars.forEach(function (s) {
              s.removeAttribute("animation__twinkle");
              s.removeAttribute("animation__scale");
              s.setAttribute("color", "#ffffff");
              s.setAttribute("material", "shader: flat; emissive: #ffffff; emissiveIntensity: 1;");
              s.setAttribute("scale", "1 1 1");
            });

            // 새로운 무작위 별 선택
            var shuffled = stars.slice().sort(function () { return Math.random() - 0.5; });
            glowingStars = shuffled.slice(0, NUM_GLOW);

            glowingStars.forEach(function (s) {
              var dur = 400 + Math.floor(Math.random() * 800);
              var delay = Math.floor(Math.random() * 800);
              s.setAttribute("color", "#FFD700");
              s.setAttribute("material", "shader: flat; emissive: #FFD700; emissiveIntensity: 2;");
              s.setAttribute("animation__twinkle",
                "property: material.emissiveIntensity; from: 0.2; to: 2.5; dir: alternate; loop: true; dur: " + dur + "; delay: " + delay + "; easing: easeInOutSine;"
              );
              s.setAttribute("animation__scale",
                "property: scale; from: 0.6 0.6 0.6; to: 1.5 1.5 1.5; dir: alternate; loop: true; dur: " + dur + "; delay: " + delay + "; easing: easeInOutSine;"
              );
            });
          }

          updateGlowing();
          setInterval(updateGlowing, 2000);
        },
      });
    </script>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0a192f;
      }
    </style>
  </head>
  <body>
    <a-scene background="color: #0a192f">
      <a-entity starfield></a-entity>

      <a-entity light="type: ambient; color: #667085; intensity: 0.8"></a-entity>
      <a-entity
        light="type: point; color: #ffffff; intensity: 1.2; distance: 90"
        position="0 6 6"
      ></a-entity>

      <a-entity id="camera-rig" position="0 1.6 0">
        <a-camera position="0 0 0"></a-camera>

        <a-entity
          animation="property: rotation; to: 360 0 0; loop: true; dur: 2500; easing: linear;"
        >
          <a-sphere
            position="5.0 0.2 0"
            radius="1.6"
            color="#008080"
            material="metalness: 0.15; roughness: 0.65;"
            animation="property: rotation; to: 0 360 0; loop: true; dur: 1200; easing: linear;"
          ></a-sphere>
        </a-entity>

        <a-entity
          rotation="8 0 0"
          animation="property: rotation; to: 0 360 0; loop: true; dur: 4000; easing: linear;"
        >
          <a-sphere
            position="7.0 0.1 0"
            radius="1.3"
            color="#FFD700"
            material="metalness: 0.15; roughness: 0.6;"
            animation="property: rotation; to: 0 360 0; loop: true; dur: 1600; easing: linear;"
          ></a-sphere>
        </a-entity>

        <a-entity
          rotation="14 0 0"
          animation="property: rotation; to: 0 360 0; loop: true; dur: 3000; easing: linear;"
        >
          <a-entity
            star-shape="color: #F70000; size: 0.52"
            position="4.2 -0.1 0"
            animation="property: rotation; to: 0 360 0; loop: true; dur: 2000; easing: linear;"
          ></a-entity>
        </a-entity>

        <a-entity
          rotation="-10 0 0"
          animation="property: rotation; to: 0 360 0; loop: true; dur: 1200; easing: linear;"
        >
          <a-box
            position="5.6 0.35 0"
            width="0.65"
            height="0.65"
            depth="0.65"
            color="#a3e635"
            material="metalness: 0.18; roughness: 0.6;"
            animation="property: rotation; to: 0 360 0; loop: true; dur: 1800; easing: linear;"
          ></a-box>
        </a-entity>

        <a-entity
          rotation="6 0 0"
          animation="property: rotation; to: 0 360 0; loop: true; dur: 3500; easing: linear;"
        >
          <a-entity
            geometry="primitive: tetrahedron; radius: 1.25"
            material="color: #8A2BE2; metalness: 0.2; roughness: 0.55;"
            position="8.5 0.0 0"
            animation="property: rotation; to: 0 360 0; loop: true; dur: 2300; easing: linear;"
          ></a-entity>
        </a-entity>

        <a-entity
          rotation="-5 0 0"
          animation="property: rotation; to: 0 360 0; loop: true; dur: 7000; easing: linear;"
        >
          <a-entity
            geometry="primitive: dodecahedron; radius: 1.55"
            material="color: #FF6600; metalness: 0.2; roughness: 0.5;"
            position="11.5 0.0 0"
            animation="property: rotation; to: 0 360 0; loop: true; dur: 2800; easing: linear;"
          ></a-entity>
        </a-entity>
      </a-entity>
    </a-scene>
  </body>
</html>
